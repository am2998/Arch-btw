name: Build Arch ISO with LTS Kernel and ZFS

on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 15 * *'

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    outputs:
      release_date: ${{ steps.build-step.outputs.RELEASE_DATE }}
      kernel_version: ${{ steps.build-step.outputs.KERNEL_VERSION }}
      zfs_version: ${{ steps.build-step.outputs.ZFS_VERSION }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build
        id: build-step
        shell: bash
        run: |
          set -euo pipefail

          kernel=linux-lts
          name=archlinux-lts-zfs
          build="$PWD/$name"
          build_out="$build/out"
          release_date=$(date +'%Y.%m.%d')
          echo "RELEASE_DATE=$release_date" >> "${GITHUB_ENV}"
          echo "BUILD_OUTPUT_DIR=$build_out" >> "${GITHUB_ENV}"

          pacman -Syy --noconfirm
          pacman -Q archiso >/dev/null 2>&1 || pacman -S --noconfirm archiso
          pacman -Q libisoburn >/dev/null 2>&1 || pacman -S --noconfirm libisoburn
          pacman -Q mtools >/dev/null 2>&1 || pacman -S --noconfirm mtools
          pacman -Q curl >/dev/null 2>&1 || pacman -S --noconfirm curl

          cp -r /usr/share/archiso/configs/releng "$build"

          sed -i "s/^linux$/$kernel/" "$build/packages.x86_64"

          pkg_add=(
            "zfs-dkms"
            "$kernel-headers"
            "iptables-nft"
          )
          for a in "${pkg_add[@]}"; do
            echo "$a" >> "$build/packages.x86_64"
          done

          pkg_rmv=(
            broadcom-wl
            b43-fwcutter
          )
          for a in "${pkg_rmv[@]}"; do
            sed -i "/$a/d" "$build/packages.x86_64"
          done

          # Include your installation assets inside the live ISO.
          install -Dm755 "src/scripts/archzfs.sh" "$build/airootfs/root/archzfs.sh"
          chmod +x "$build/airootfs/root/archzfs.sh"
          install -Dm755 "src/pacman-hooks/zfs-dracut-kernel-refresh.sh" \
            "$build/airootfs/usr/local/share/archzfs/zfs-dracut-kernel-refresh.sh"
          install -Dm644 "src/pacman-hooks/60-zfs-dracut-post.hook" \
            "$build/airootfs/usr/local/share/archzfs/60-zfs-dracut-post.hook"

          # Kernel naming: since mkinitcpio v39, initramfs presets are generated
          # automatically by the mkinitcpio libalpm hook, and the current releng
          # profile no longer ships airootfs/etc/mkinitcpio.d/linux.preset. With
          # the package swapped to linux-lts, the hook derives everything from
          # PKGBASE, so the boot files are /boot/vmlinuz-linux-lts and
          # /boot/initramfs-linux-lts.img. Instead of descending into profile
          # paths that change between archiso releases (this once hard-broke the
          # build), patch every boot loader config found in the profile.
          boot_cfg_dirs=()
          for boot_cfg_dir in "$build/grub" "$build/syslinux" "$build/efiboot/loader/entries"; do
            [[ -d "$boot_cfg_dir" ]] && boot_cfg_dirs+=("$boot_cfg_dir")
          done
          if (( ${#boot_cfg_dirs[@]} == 0 )); then
            printf 'error: no boot loader config directories found in the releng profile\n' >&2
            exit 1
          fi
          find "${boot_cfg_dirs[@]}" -type f \( -name '*.conf' -o -name '*.cfg' \) \
            -exec sed -i \
              -e "s/vmlinuz-linux\b/vmlinuz-$kernel/g" \
              -e "s/initramfs-linux\.img/initramfs-$kernel\.img/g" {} +
          if grep -rqE 'vmlinuz-linux([^a-zA-Z0-9-]|$)|initramfs-linux\.img' "${boot_cfg_dirs[@]}"; then
            printf 'error: unpatched stock kernel reference remains in boot configs\n' >&2
            exit 1
          fi
          if ! grep -rq -- "vmlinuz-$kernel" "${boot_cfg_dirs[@]}"; then
            printf 'error: boot configs do not reference vmlinuz-%s\n' "$kernel" >&2
            exit 1
          fi

          cp "$build/pacman.conf" "$build/airootfs/etc/pacman.conf"
          mkdir -p "$build/airootfs/usr/share/pacman/keyrings"
          # SigLevel = TrustAll is limited to ISO build/live usage: mkarchiso
          # verifies with the host keyring, which does not trust the ArchZFS key.
          # The installed system normalizes [archzfs] to SigLevel = Required
          # (see src/scripts/archzfs.sh) after importing the release key.
          echo -e "\n[archzfs]\nSigLevel = TrustAll Optional\nServer = https://github.com/archzfs/archzfs/releases/download/experimental" >> "$build/pacman.conf"
          echo -e "\n[archzfs]\nSigLevel = TrustAll Optional\nServer = https://github.com/archzfs/archzfs/releases/download/experimental" >> "$build/airootfs/etc/pacman.conf"
          echo -e "3A9917BF0DED5C13F69AC68FABEC0A1208037BE9:4:" >> "$build/airootfs/usr/share/pacman/keyrings/archzfs-trusted"
          echo -e "-----BEGIN PGP PUBLIC KEY BLOCK-----\n\nmDMEZwfegRYJKwYBBAHaRw8BAQdApTEe98tOu58rF+0NUGXXx/VxenWgb0VjnvBx\niSEYUcK0LEFyY2haRlMgUHJvamVjdCAoaHR0cHM6Ly9naXRodWIuY29tL2FyY2h6\nZnMpiJgEExYKAEAWIQQ6mRe/De1cE/aaxo+r7AoSCAN76QUCZwfegQIbAwsLCQoN\nCAwHCwQDAgcVCgkICwIDBRYCAwEAAh4FAheAAAoJEKvsChIIA3vpfFAA/2XBSvSt\nhopEFZOqY25peeXAXfl7ufCXolvGEE9iSh1sAQDm08strIIy0SNZtMtWg7r70tCw\n7I6z1M7liy+rfgLBDw==\n=SxXd\n-----END PGP PUBLIC KEY BLOCK-----" >> "$build/airootfs/usr/share/pacman/keyrings/archzfs.gpg"

          printf '\033[1m Welcome to Arch Linux LTS with OpenZFS \033[0m\n\nInstaller script included at: /root/archzfs.sh\n' > "$build/airootfs/etc/motd"

          profile="$build/profiledef.sh"
          # The upstream iso_label line uses SOURCE_DATE_EPOCH, so match the
          # whole line instead of a verbatim snapshot of the old text.
          label_date=$(date +%Y-%m-%d)
          sed -i "s/iso_name=\"archlinux\"/iso_name=\"archlinux-lts-zfs\"/" "$profile"
          sed -i "s|^iso_label=.*|iso_label=\"ArchLTSZFS_${label_date}\"|" "$profile"
          sed -i "/choose-mirror/d" "$profile"

          [ -d "/tmp/$name" ] && cd /tmp && rm -rf "$name"
          mkarchiso -v -w "/tmp/$name" -o "$build_out" "$build"

          cd "$build_out"
          ls -alh
          mkdir extracted && cd extracted
          osirrox -indev "../archlinux-lts-zfs-$release_date-x86_64.iso" -extract_boot_images ./ -extract /EFI/BOOT/BOOTx64.EFI loader.efi
          curl -fL --retry 3 -o BOOTx64.EFI https://blog.hansenpartnership.com/wp-uploads/2013/PreLoader.efi
          curl -fL --retry 3 -o HashTool.efi https://blog.hansenpartnership.com/wp-uploads/2013/HashTool.efi
          mcopy -D oO -i eltorito_img2_uefi.img BOOTx64.EFI loader.efi HashTool.efi ::/EFI/BOOT/
          xorriso -indev ../archlinux-lts-zfs-$release_date-x86_64.iso -outdev archlinux-lts-zfs-sb-$release_date-x86_64.iso -map_l ./ /EFI/BOOT/ BOOTx64.EFI loader.efi HashTool.efi -- -boot_image any replay -append_partition 2 0xef eltorito_img2_uefi.img
          mv archlinux-lts-zfs-sb-$release_date-x86_64.iso ../archlinux-lts-zfs-$release_date-x86_64.iso
          cd .. && rm -rf extracted

          # Post-build verification: the ISO must contain the installer payloads
          # and a UEFI boot image. This catches packaging regressions before
          # publishing. Note the payloads are NOT on the ISO 9660 file system
          # itself: mkarchiso packs airootfs into a squashfs image
          # (/arch/x86_64/airootfs.sfs), so osirrox cannot extract them directly.
          # Pull the squashfs out of the ISO and check its file listing instead.
          iso="$build_out/archlinux-lts-zfs-$release_date-x86_64.iso"
          [ -s "$iso" ]
          osirrox -indev "$iso" -extract /arch/x86_64/airootfs.sfs /tmp/archzfs-airootfs.sfs
          [ -s /tmp/archzfs-airootfs.sfs ]
          airootfs_listing=$(unsquashfs -l /tmp/archzfs-airootfs.sfs)
          for payload in \
            root/archzfs.sh \
            usr/local/share/archzfs/zfs-dracut-kernel-refresh.sh \
            usr/local/share/archzfs/60-zfs-dracut-post.hook; do
            if ! grep -qF -- "$payload" <<<"$airootfs_listing"; then
              printf 'error: airootfs.sfs does not contain /%s\n' "$payload" >&2
              exit 1
            fi
          done
          osirrox -indev "$iso" -extract /EFI/BOOT/BOOTx64.EFI /tmp/BOOTx64.efi
          [ -s /tmp/BOOTx64.efi ]
          xorriso -indev "$iso" -report_el_torito plain 2>/dev/null | grep 'UEFI' >/dev/null

          sha256sum archlinux-lts-zfs-$release_date-x86_64.iso > archlinux-lts-zfs-$release_date-x86_64.iso.sha256

          echo "KERNEL_VERSION=$(chroot /tmp/$name/x86_64/airootfs pacman -Q linux-lts | sed 's/\s\+/:/')" >> "${GITHUB_OUTPUT}"
          echo "ZFS_VERSION=$(chroot /tmp/$name/x86_64/airootfs pacman -Q zfs-dkms | sed 's/\s\+/:/')" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_DATE=$release_date" >> "${GITHUB_OUTPUT}"

      - name: upload-iso
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-lts-zfs-${{ env.RELEASE_DATE }}-x86_64.iso
          path: ${{ env.BUILD_OUTPUT_DIR }}/archlinux-lts-zfs-${{ env.RELEASE_DATE }}-x86_64.iso
          retention-days: 1

      - name: upload-sha
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-lts-zfs-${{ env.RELEASE_DATE }}-x86_64.iso.sha256
          path: ${{ env.BUILD_OUTPUT_DIR }}/archlinux-lts-zfs-${{ env.RELEASE_DATE }}-x86_64.iso.sha256
          retention-days: 1

  download-and-publish:
    runs-on: ubuntu-latest
    needs: build-and-upload
    strategy:
      matrix:
        include:
          - artifact_name: archlinux-lts-zfs-${{ needs.build-and-upload.outputs.release_date }}-x86_64.iso
            file: archlinux-lts-zfs-${{ needs.build-and-upload.outputs.release_date }}-x86_64.iso
          - artifact_name: archlinux-lts-zfs-${{ needs.build-and-upload.outputs.release_date }}-x86_64.iso.sha256
            file: archlinux-lts-zfs-${{ needs.build-and-upload.outputs.release_date }}-x86_64.iso.sha256
    steps:
      - name: download
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./

      - name: verify
        shell: bash
        run: |
          ls -alh

      - name: publish
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./${{ matrix.file }}
          asset_name: ${{ matrix.file }}
          tag: ${{ needs.build-and-upload.outputs.release_date }}
          body: "Packages: ${{ needs.build-and-upload.outputs.kernel_version }} & ${{ needs.build-and-upload.outputs.zfs_version }}"
          overwrite: true
          file_glob: false
